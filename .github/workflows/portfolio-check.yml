name: Portfolio checks

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret files
        run: |
          ! find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .
      - name: Check project index
        run: test -s README.md && test -s docs/project-audit.md
